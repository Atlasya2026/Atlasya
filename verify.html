<style>
:root{--bg:#06151f;--card:#0f2a3a;--line:rgba(255,255,255,.1);--text:#e8f1f5;--muted:#8fa6b3;--green:#27a346;--gold:#f0c040;--danger:#ff7a7a}
@media(prefers-color-scheme:light){:root{--bg:#f1f6fa;--card:#fff;--line:rgba(10,40,60,.12);--text:#12212b;--muted:#5b7080;--green:#1e7a34}}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.7}
.box{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.bar{height:5px;background:linear-gradient(90deg,var(--green),var(--gold))}
.in{padding:28px 24px;text-align:center}
.logo{width:76px;height:76px;object-fit:contain}
.brand{font-weight:900;letter-spacing:1px;margin-top:2px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.st{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;padding:6px 16px;border-radius:99px;font-weight:700;font-size:14px}
.st.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.st.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.ico{font-size:54px;margin-top:10px}
h1{font-size:25px;font-weight:900;margin:4px 0}
.who{font-size:15px;color:var(--muted)}.who b{color:var(--text);font-size:19px;display:block}
.desc{margin-top:12px;color:var(--muted);font-size:14.5px}
.row{display:flex;justify-content:center;gap:22px;margin-top:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}.row b{color:var(--text);display:block}
.note{margin-top:20px;padding:12px 14px;border-radius:12px;background:rgba(127,127,127,.1);font-size:12.5px;color:var(--muted)}
.cta{display:inline-block;margin-top:20px;padding:11px 22px;border-radius:12px;background:linear-gradient(135deg,#1e7a34,#27a346);color:#fff;font-weight:700;text-decoration:none}
.card-img{width:100%;border-radius:12px;margin-top:18px;border:1px solid var(--line)}
.hidden{display:none}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s .8s linear infinite;margin:30px auto}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
